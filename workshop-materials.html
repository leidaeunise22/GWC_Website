<!-- Load this workshop's materials -->
<script type="module">
  import { app } from "./firebase-config.js";
  import { getFirestore, doc, getDoc }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const db = getFirestore(app);

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  function isSafeUrl(url) {
    return typeof url === "string" && /^https?:\/\//i.test(url);
  }

  async function loadMaterials() {
    const list = document.getElementById("materialsList");
    const params = new URLSearchParams(window.location.search);
    const workshopId = params.get("id");

    if (!workshopId) {
      list.innerHTML = "<div class='empty-state'>No workshop selected.</div>";
      return;
    }

    try {
      const snap = await getDoc(doc(db, "workshops", workshopId));
      if (!snap.exists()) {
        list.innerHTML = "<div class='empty-state'>Workshop not found.</div>";
        return;
      }

      const w = snap.data();
      document.getElementById("workshopTitle").textContent = w.name;

      const materials = (Array.isArray(w.materials) ? w.materials : []).filter(m => isSafeUrl(m.url));

      if (!materials.length) {
        list.innerHTML = "<div class='empty-state'>No materials uploaded yet.</div>";
        return;
      }

      list.innerHTML = materials.map(m => `
        <div class="workshop">
          <h2>${escapeHtml(m.label)}</h2>
          <a class="teal-btn" href="${m.url}" target="_blank" rel="noopener">${m.type === "pdf" ? "Download" : "View"}</a>
        </div>`).join("");
    } catch (err) {
      console.error("Load materials error:", err);
      list.innerHTML = "<div class='empty-state'>Couldn't load materials right now. Please try again later.</div>";
    }
  }

  loadMaterials();
</script>
